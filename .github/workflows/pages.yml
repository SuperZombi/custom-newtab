name: Pages

on:
  push:
    branches: ["main"]
    paths: ["src/**"]
  workflow_dispatch:

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-react:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
      - run: npm install
      - run: npm run build

      - name: Remove manifest
        run: rm -f dist/manifest.json
      - name: Add website script
        run: |
          sed -i 's|</head>|\t<script>\n'"$(cat website.js)"'\n\t</script>\n</head>|' dist/index.html
      - name: Copy GitHub images
        run: |
          mkdir -p dist/github/images
          cp -R github/images/. dist/github/images/
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-react
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
