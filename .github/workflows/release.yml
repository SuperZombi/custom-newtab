name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-react:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
      - run: npm install
      - run: npm run build

      - name: Create ZIP
        run: |
          cd dist
          zip -r ../extension.zip .
      - name: Upload Release Asset
        uses: xresloader/upload-to-github-release@v1
        with:
          file: extension.zip
          overwrite: true
          update_latest_release: true
